[project]
name = "memory-gateway"
version = "0.1.0"
description = "Local HTTP gateway fronting several agent-memory arms for evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "graphiti-core[falkordblite]>=0.31,<0.32",
    "anthropic[bedrock]",
    "boto3",
    "fastembed",
    "numpy",
    "pyyaml",
    "python-frontmatter",
]

[project.scripts]
memory-gateway = "memory_gateway.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
